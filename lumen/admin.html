<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>Admin · Lumen</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .admin-shell { max-width: 1200px; margin: 0 auto; padding: 32px 40px 80px; }
  .admin-top { display: flex; align-items: center; gap: 16px; padding: 16px 0 24px; border-bottom: 1px solid var(--border-strong); margin-bottom: 32px; flex-wrap: wrap; }
  .admin-top .nav-logo { font-size: 24px; }
  .admin-tabs { display: flex; gap: 8px; flex: 1; }
  .admin-user { font-size: 13px; color: var(--text-muted); }
  .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
  .stat-card h3 { font-family: var(--font-mono); font-size: 30px; color: var(--accent); font-weight: 400; }
  .stat-card p { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .form-grid { display: grid; grid-template-columns: 3fr 2fr; gap: 32px; align-items: start; }
  fieldset { border: 1px solid var(--border-strong); border-radius: 12px; padding: 20px; margin-bottom: 24px; background: var(--bg-card); }
  legend { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); padding: 0 8px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--text-primary); margin: 14px 0 4px; }
  label .hint { font-weight: 400; color: var(--text-muted); }
  input[type="text"], input[type="url"], input[type="number"], input[type="email"], input[type="password"],
  input[type="datetime-local"], select, textarea {
    width: 100%; font-family: var(--font-body); font-size: 14px; color: var(--text-primary);
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: 8px; padding: 9px 12px;
  }
  textarea { min-height: 72px; resize: vertical; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .counter { font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 2px; }
  .counter.over { color: #B00020; }
  .rte-bar { display: flex; gap: 4px; margin-bottom: 6px; }
  .rte-bar button { font-family: var(--font-body); font-size: 13px; border: 1px solid var(--border-strong); background: var(--bg); border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--text-primary); }
  .rte-bar button:hover { background: var(--bg-raised); }
  #body-editor { min-height: 220px; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 8px; padding: 12px 14px; font-size: 15px; }
  #body-editor:focus { outline: 2px solid var(--accent); }
  #body-editor blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--text-primary); font-style: italic; margin: 12px 0; }
  .sticky-side { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 20px; }
  .filter-result { border-radius: 12px; border: 1px solid var(--border-strong); padding: 20px; font-size: 14px; background: var(--bg-card); }
  .filter-result.pass { background: #EAF3EA; border-color: var(--success); }
  .filter-result.fail { background: #F9E9E4; border-color: #B00020; }
  .filter-result.review { background: #FAF3DF; border-color: #C4910A; }
  .filter-result h4 { font-family: var(--font-mono); font-weight: 400; font-size: 15px; margin-bottom: 12px; }
  .filter-line { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .filter-line .r { font-family: var(--font-mono); font-size: 11px; min-width: 88px; }
  .filter-line .r.PASS { color: var(--success); }
  .filter-line .r.FAIL { color: #B00020; }
  .preview-card { background: var(--bg); border: 1px solid var(--border-strong); border-radius: 12px; padding: 20px; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .admin-table th { text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); padding: 10px 12px; border-bottom: 1px solid var(--border-strong); }
  .admin-table td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .admin-table .act { white-space: nowrap; }
  .admin-table .act button { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; font-family: var(--font-body); padding: 0; margin-right: 12px; }
  .admin-table .act button:hover { color: var(--accent-dark); text-decoration: underline; }
  .tag-local { font-family: var(--font-mono); font-size: 10px; color: var(--white); background: var(--accent); border-radius: 4px; padding: 2px 6px; }
  .tag-file { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); border: 1px solid var(--border-strong); border-radius: 4px; padding: 2px 6px; }
  .login-box { max-width: 400px; margin: 100px auto; }
  .activity { font-size: 13px; color: var(--text-body); }
  .activity li { padding: 8px 0; border-bottom: 1px solid var(--border); list-style: none; }
  .activity .when { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .saved-note { font-size: 12px; color: var(--text-muted); }
  .alert { font-size: 13px; border-radius: 8px; padding: 10px 14px; margin-top: 12px; }
  .alert.ok { background: #EAF3EA; color: var(--success); }
  .alert.warn { background: #FAF3DF; color: #8a6a06; }
  dialog { border: 1px solid var(--border-strong); border-radius: 12px; padding: 28px; max-width: 440px; background: var(--bg); color: var(--text-body); }
  dialog::backdrop { background: rgba(26,16,8,0.4); }
  @media (max-width: 900px) { .form-grid, .stat-grid, .field-row { grid-template-columns: 1fr; } .admin-shell { padding: 20px; } }
</style>
</head>
<body>
<div class="admin-shell" id="admin-root"></div>

<script src="data/stories.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     CONFIG. No plaintext passwords ship in this file. Each team
     member carries a SHA-256 hash of their passphrase; the login
     hashes what is typed and compares. This UI gate only protects
     the local editing workflow: real publishing is gated server
     side by PUBLISH_SECRET in /api/publish, so the hashes here
     guard convenience, not secret data. Move to real auth when you
     add a database. To rotate a password, replace its passHash with
     the SHA-256 hex of the new passphrase.
  ============================================================ */
  var TEAM = [
    { email: 'editor@readlumen.site', passHash: '581f56552ec304ff11bfc0a603c405628c0dbf7bc1bcec776cc35c2fb45557ee', name: 'Nathan Stanley', role: 'Editor' },
    { email: 'writer@readlumen.site', passHash: '1120a7777584b4eb06cb3b101d25a39b9eac32a0b8ee7a6fb2864d6ca8a7f4cd', name: 'Lumen Writer', role: 'Writer' }
  ];
  /* SHA-256 hex of a string, via the platform SubtleCrypto (https or localhost only). */
  function sha256Hex(str) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
    });
  }
  var AI_ENDPOINT = '/api/claude';

  var CATEGORIES = ['Medicine', 'Biotechnology', 'Health Tech', 'Brain Science', 'Longevity', 'Global Health', 'Mental Health'];
  var REGIONS = ['Global', 'Americas', 'Europe', 'Africa', 'Asia-Pacific'];

  /* ---------- storage ---------- */
  function get(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
  function set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
  /* The publish key (PUBLISH_SECRET) is NEVER stored in site code. The editor
     enters it at publish time; we cache it in sessionStorage for the tab only. */
  function getPublishSecret(forcePrompt) {
    var k = 'lumen_publish_secret';
    var v = forcePrompt ? '' : (sessionStorage.getItem(k) || '');
    if (!v) {
      v = window.prompt('Enter the publish key.\n(Matches PUBLISH_SECRET in Vercel; sent only to your own /api/publish, never stored in the site.)');
      if (v == null) return null;            /* cancelled */
      v = v.trim();
      if (!v) return null;
      try { sessionStorage.setItem(k, v); } catch (e) {}
    }
    return v;
  }
  function session() { var s = get('lumen_session', null); return s && s.exp > Date.now() ? s : null; }
  function fileStories() { return (window.LUMEN_DATA && window.LUMEN_DATA.stories) || []; }
  function localStories() { return get('lumen_local_stories', []); }
  function drafts() { return get('lumen_local_drafts', []); }
  function activity() { return get('lumen_activity', []); }
  function logActivity(action) {
    var a = activity();
    a.unshift({ who: (session() || {}).name || 'Unknown', what: action, when: new Date().toISOString() });
    set('lumen_activity', a.slice(0, 50));
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var root = document.getElementById('admin-root');

  /* ============================================================
     LOGIN
  ============================================================ */
  function renderLogin() {
    root.innerHTML =
      '<div class="login-box panel">' +
      '<span class="nav-logo" style="font-family:var(--font-display);font-weight:700;color:var(--accent);font-size:26px">Lumen</span>' +
      '<h1 style="font-size:24px;margin:6px 0 18px">Editor sign in</h1>' +
      '<form id="login-form">' +
      '<label>Email</label><input type="email" id="li-email" required autocomplete="username">' +
      '<label>Password</label><input type="password" id="li-pass" required autocomplete="current-password">' +
      '<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-top:14px"><input type="checkbox" id="li-remember" style="width:auto"> Remember me for 30 days</label>' +
      '<button class="btn" style="margin-top:18px;width:100%" type="submit">Sign in</button>' +
      '<div id="li-err"></div></form>' +
      '<p style="font-size:12px;color:var(--text-muted);margin-top:16px"><a href="index.html">\u2190 Back to the site</a></p></div>';
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('li-email').value.trim().toLowerCase();
      var pass = document.getElementById('li-pass').value;
      function fail() {
        document.getElementById('li-err').innerHTML = '<div class="alert warn">That email and password don\u2019t match. Check admin.html \u2192 TEAM if you\u2019ve changed credentials.</div>';
      }
      if (!crypto || !crypto.subtle) {
        document.getElementById('li-err').innerHTML = '<div class="alert warn">Sign in needs a secure context (https or localhost). Open this page over https.</div>';
        return;
      }
      sha256Hex(pass).then(function (hash) {
        var user = TEAM.filter(function (t) { return t.email === email && t.passHash === hash; })[0];
        if (!user) { fail(); return; }
        var days = document.getElementById('li-remember').checked ? 30 : 1;
        set('lumen_session', { email: user.email, name: user.name, role: user.role, exp: Date.now() + days * 86400000 });
        logActivity('signed in');
        route();
      }).catch(fail);
    });
  }

  /* ============================================================
     SHELL + ROUTING
  ============================================================ */
  function shell(view, content) {
    var s = session();
    var tabs = [
      ['#dashboard', 'Dashboard'], ['#new', 'New story'], ['#stories', 'Stories']
    ].map(function (t) {
      return '<a class="chip' + (view === t[0] ? ' active' : '') + '" href="' + t[0] + '">' + t[1] + '</a>';
    }).join('');
    root.innerHTML =
      '<div class="admin-top">' +
      '<a class="nav-logo" href="index.html" style="font-family:var(--font-display);font-weight:700;color:var(--accent)">Lumen</a>' +
      '<span class="cat-label">Admin</span>' +
      '<div class="admin-tabs">' + tabs + '</div>' +
      '<span class="admin-user">' + esc(s.name) + ' \u00B7 ' + esc(s.role) + '</span>' +
      '<button class="btn btn-sm btn-ghost" id="logout">Sign out</button></div>' +
      '<div id="view">' + content + '</div>';
    document.getElementById('logout').addEventListener('click', function () {
      localStorage.removeItem('lumen_session');
      route();
    });
  }

  function route() {
    if (!session()) return renderLogin();
    var h = location.hash || '#dashboard';
    if (h.indexOf('#new') === 0) return renderEditor(h.split('=')[1] || null);
    if (h === '#stories') return renderStories();
    return renderDashboard();
  }
  window.addEventListener('hashchange', route);

  /* ============================================================
     DASHBOARD
  ============================================================ */
  function renderDashboard() {
    var locals = localStories();
    var all = fileStories().length + locals.length;
    var weekAgo = Date.now() - 7 * 86400000;
    var thisWeek = fileStories().concat(locals).filter(function (s) { return new Date(s.publishDate) > weekAgo; }).length;
    var failed = locals.filter(function (s) { return s._filterResult === 'FAIL'; }).length;
    var act = activity().slice(0, 8).map(function (a) {
      return '<li><span class="when">' + new Date(a.when).toLocaleString() + '</span>, ' + esc(a.who) + ' ' + esc(a.what) + '</li>';
    }).join('') || '<li>No activity yet.</li>';

    shell('#dashboard',
      '<div class="stat-grid">' +
      '<div class="panel stat-card"><h3>' + thisWeek + '</h3><p>Published this week</p></div>' +
      '<div class="panel stat-card"><h3>' + all + '</h3><p>Stories all time</p></div>' +
      '<div class="panel stat-card"><h3>' + drafts().length + '</h3><p>Drafts awaiting review</p></div>' +
      '<div class="panel stat-card"><h3>' + failed + '</h3><p>Published despite failed filter</p></div>' +
      '</div>' +
      '<div class="grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:24px">' +
      '<div class="panel"><h2 style="font-size:20px;margin-bottom:12px">Quick actions</h2>' +
      '<p style="font-size:14px;margin-bottom:16px">Write and publish a story, or export everything you\u2019ve published locally into the live data file.</p>' +
      '<a class="btn" href="#new" style="margin-right:10px">+ New story</a>' +
      '<button class="btn btn-ghost" id="download-data">Download stories.js</button> ' +
      '<button class="btn btn-ghost" id="download-feed" style="margin-top:8px">Download feed.xml</button>' +
      '<p style="font-size:12px;color:var(--text-muted);margin-top:14px">' + locals.length + ' locally published ' + (locals.length === 1 ? 'story' : 'stories') + ' waiting to go live. Replace <code>data/stories.js</code> with the download and redeploy, then they\u2019re public. Replace <code>feed.xml</code> at the same time to keep the RSS feed current.</p>' +
      (drafts().length ? '<h3 style="font-size:16px;margin:20px 0 8px">Drafts</h3>' + drafts().map(function (d, i) {
        return '<p style="font-size:14px;padding:6px 0;border-bottom:1px solid var(--border)"><a href="#new=draft-' + i + '">' + esc(d.headline || 'Untitled draft') + '</a> <span class="saved-note">\u00B7 saved ' + new Date(d._savedAt).toLocaleString() + '</span></p>';
      }).join('') : '') +
      '</div>' +
      '<div class="panel"><h2 style="font-size:20px;margin-bottom:12px">Recent activity</h2><ul class="activity">' + act + '</ul></div>' +
      '</div>');

    document.getElementById('download-data').addEventListener('click', downloadDataFile);
    document.getElementById('download-feed').addEventListener('click', downloadFeed);
  }

  function mergedStories() {
    var merged = fileStories().slice();
    localStories().forEach(function (s) {
      var clean = JSON.parse(JSON.stringify(s));
      delete clean._filterResult;
      var idx = merged.findIndex(function (m) { return m.slug === clean.slug; });
      if (idx >= 0) merged[idx] = clean; else merged.push(clean);
    });
    return merged;
  }

  function downloadFeed() {
    function x(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/==/g, '');
    }
    var site = 'https://readlumen.site';
    var items = mergedStories().slice().sort(function (a, b) {
      return new Date(b.publishDate) - new Date(a.publishDate);
    }).slice(0, 30).map(function (s) {
      var link = site + '/story.html?slug=' + encodeURIComponent(s.slug);
      return '  <item>\n' +
        '    <title>' + x(s.headline) + '</title>\n' +
        '    <link>' + link + '</link>\n' +
        '    <guid isPermaLink="true">' + link + '</guid>\n' +
        '    <pubDate>' + new Date(s.publishDate).toUTCString() + '</pubDate>\n' +
        '    <category>' + x(s.category) + '</category>\n' +
        '    <description>' + x(s.lede) + '</description>\n' +
        '  </item>';
    }).join('\n');
    var xml = '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<rss version="2.0"><channel>\n' +
      '  <title>Lumen</title>\n' +
      '  <link>' + site + '</link>\n' +
      '  <description>Breakthroughs brought to light. Evidence-first health and medical-technology journalism.</description>\n' +
      '  <language>en</language>\n' +
      '  <lastBuildDate>' + new Date().toUTCString() + '</lastBuildDate>\n' +
      items + '\n</channel></rss>\n';
    var blob = new Blob([xml], { type: 'application/rss+xml' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'feed.xml';
    a.click();
    URL.revokeObjectURL(a.href);
    logActivity('downloaded feed.xml');
  }

  function downloadDataFile() {
    var merged = mergedStories();
    var corrections = ((window.LUMEN_DATA && window.LUMEN_DATA.corrections) || []).concat(get('lumen_local_corrections', []));
    var content = '/* LUMEN story data, generated from Admin on ' + new Date().toISOString() + '\n' +
      '   Replace data/stories.js with this file and redeploy. */\n\n' +
      'window.LUMEN_DATA = ' + JSON.stringify({ stories: merged, corrections: corrections }, null, 2) + ';\n';
    var blob = new Blob([content], { type: 'text/javascript' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'stories.js';
    a.click();
    URL.revokeObjectURL(a.href);
    logActivity('downloaded stories.js (' + merged.length + ' stories)');
  }

  /* ============================================================
     STORY EDITOR (/admin/new-story)
  ============================================================ */
  var autosaveTimer = null;
  var currentDraftIndex = null;
  var editingSlug = null;
  var lastFilter = null;

  function renderEditor(ref) {
    var data = {};
    currentDraftIndex = null; editingSlug = null; lastFilter = null;
    if (ref && ref.indexOf('draft-') === 0) {
      currentDraftIndex = parseInt(ref.slice(6), 10);
      data = drafts()[currentDraftIndex] || {};
    } else if (ref) {
      editingSlug = decodeURIComponent(ref);
      data = localStories().concat(fileStories()).filter(function (s) { return s.slug === editingSlug; })[0] || {};
    }

    function field(label, html, hint) {
      return '<label>' + label + (hint ? ' <span class="hint">' + hint + '</span>' : '') + '</label>' + html;
    }
    function input(id, type, val, attrs) {
      return '<input type="' + type + '" id="' + id + '" value="' + esc(val || '') + '" ' + (attrs || '') + '>';
    }

    var canPublish = session().role === 'Editor';

    shell('#new',
      '<div class="form-grid"><form id="story-form"><h1 style="font-size:26px;margin-bottom:18px">' + (editingSlug ? 'Edit story' : 'New story') + '</h1>' +

      '<fieldset><legend>Story metadata</legend>' +
      field('Headline', input('f-headline', 'text', data.headline, 'maxlength="130" required') + '<div class="counter" id="headline-count"></div>', '(lead with the number, wrap one word in ==word== to highlight it on the homepage)') +
      field('Slug', input('f-slug', 'text', data.slug, 'required'), '(auto-generated, editable)') +
      '<div class="field-row">' +
      field('Category', '<select id="f-category" required>' + CATEGORIES.map(function (c) { return '<option' + (data.category === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>') +
      field('Sub-category', input('f-sub', 'text', data.subCategory), '(optional)') + '</div>' +
      '<div class="field-row">' +
      field('Region', '<select id="f-region">' + REGIONS.map(function (r) { return '<option' + (data.region === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select>') + '</div>' +
      '<div class="field-row">' +
      field('Publish date', input('f-date', 'datetime-local', data.publishDate ? data.publishDate.slice(0, 16) : new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16))) +
      field('Author', '<select id="f-author">' + TEAM.map(function (t) { return '<option' + (data.author === t.name ? ' selected' : '') + '>' + t.name + '</option>'; }).join('') + '<option' + (data.author === 'Lumen Editorial' ? ' selected' : '') + '>Lumen Editorial</option></select>') + '</div>' +
      '<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="f-breaking" style="width:auto"' + (data.breaking ? ' checked' : '') + '> Breaking: prioritize in the story order</label>' +
      '<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="f-featured" style="width:auto"' + (data.featured ? ' checked' : '') + '> Featured: homepage hero</label>' +
      '<p class="saved-note" style="margin-top:8px">Read time: <span id="readtime">, </span> min (auto-calculated)</p>' +
      '</fieldset>' +

      '<fieldset><legend>Story content</legend>' +
      field('Lede', '<textarea id="f-lede" maxlength="200" required>' + esc(data.lede || '') + '</textarea><div class="counter" id="lede-count"></div>', '(one sentence, states the key number or outcome, max 200)') +
      field('\u201CWhy it matters\u201D', '<textarea id="f-why">' + esc(data.whyItMatters || '') + '</textarea>', '(shown in accent color on the site)') +
      field('Reality check', '<textarea id="f-realitycheck">' + esc(data.realityCheck || '') + '</textarea>', '(MANDATORY, what this does and does NOT mean; one study isn\u2019t proof. Renders as a callout on the page.)') +
      field('Body', '<div class="rte-bar">' +
        '<button type="button" data-cmd="bold"><strong>B</strong></button>' +
        '<button type="button" data-cmd="italic"><em>I</em></button>' +
        '<button type="button" data-cmd="formatBlock" data-val="blockquote">\u201D Quote</button>' +
        '<button type="button" data-cmd="insertUnorderedList">\u2022 List</button>' +

    /* --- behaviour --- */
    var form = document.getElementById('story-form');

    function counters() {
      [['f-headline', 'headline-count', 130], ['f-lede', 'lede-count', 200], ['f-meta', 'meta-count', 160]].forEach(function (c) {
        var el = document.getElementById(c[0]), out = document.getElementById(c[1]);
        var n = (el.value || '').length;
        out.textContent = n + ' / ' + c[2];
        out.classList.toggle('over', n >= c[2]);
      });
    }
    function slugify(s) {
      return s.replace(/==/g, '').toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-').slice(0, 80);
    }
    var slugTouched = !!data.slug;

    document.getElementById('f-headline').addEventListener('input', function () {
      if (!slugTouched) document.getElementById('f-slug').value = slugify(this.value);

    function readTime() {
      var words = (document.getElementById('body-editor').innerText + ' ' + document.getElementById('f-lede').value).trim().split(/\s+/).length;
      var mins = Math.max(1, Math.round(words / 220));
      document.getElementById('readtime').textContent = mins;
      return mins;

    /* rich text */
    document.querySelector('.rte-bar').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.id === 'clean-paras') return;
      var cmd = b.getAttribute('data-cmd');
      if (cmd === 'createLink') {
        var url = prompt('Link URL (https://\u2026):');
        if (url) document.execCommand('createLink', false, url);
      } else {
        document.execCommand(cmd, false, b.getAttribute('data-val') || null);
      }
      document.getElementById('body-editor').focus();
    });

    /* paste cleaner: PDFs/Word copy text with a hard line break per visual
       line, which turns every line into its own paragraph. On paste we
       rebuild real paragraphs: blank lines = breaks; single newlines are
       joined unless the line clearly ends a sentence. */
    function cleanToParagraphs(text, ignoreBlanks) {
      var lines = text.replace(/\r\n?/g, '\n').split('\n');
      var paras = [], buf = '';
      function flush() { var t = buf.trim(); if (t) paras.push(t); buf = ''; }
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) { if (!ignoreBlanks) flush(); continue; }
        buf += (buf ? ' ' : '') + line;
        if (/[.!?\u2026][\u201D")\u2019]?$/.test(line)) {
          var next = (lines[i + 1] || '').trim();
          if (ignoreBlanks) next = next || (lines[i + 2] || '').trim();
          if (!next || /^[A-Z\u201C"(0-9]/.test(next)) flush();
        }
      }
      flush();
      return paras;
    }
    var bodyEd = document.getElementById('body-editor');
    bodyEd.addEventListener('paste', function (e) {
      var text = (e.clipboardData || window.clipboardData).getData('text/plain');
      if (!text || text.indexOf('\n') === -1) return; /* simple paste: leave as-is */
      e.preventDefault();
      var html = cleanToParagraphs(text).map(function (p) {
        return '<p>' + p.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</p>';
      }).join('');
      if (!bodyEd.innerText.trim()) { bodyEd.innerHTML = html; bodyEd.dispatchEvent(new Event('input', { bubbles: true })); }
      else document.execCommand('insertHTML', false, html);
    });
    document.getElementById('clean-paras').addEventListener('click', function () {
      var text = bodyEd.innerText;
      if (!text.trim()) return;
      bodyEd.innerHTML = cleanToParagraphs(text, true).map(function (p) {
        return '<p>' + p.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</p>';
      }).join('');
      livePreview();
      document.getElementById('form-alert').innerHTML = '<div class="alert ok">Paragraphs rebuilt. Note: this resets bold/italic/links in the body, reapply any you need, then publish.</div>';
    });

    /* image upload: resize to max 1600px wide */
    document.getElementById('f-image-file').addEventListener('change', function () {
      var f = this.files[0]; if (!f) return;
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 1600 / img.width);
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        document.getElementById('image-preview').innerHTML = '<img src="' + dataUrl + '" style="border-radius:8px;margin-top:10px;max-height:140px">';
        document.getElementById('image-preview').setAttribute('data-src', dataUrl);
        if (img.width < 1600) {
          document.getElementById('form-alert').innerHTML = '<div class="alert warn">Heads up: this image is ' + img.width + 'px wide, the guidelines ask for at least 1600px.</div>';
        }
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(f);
    });

    function collect() {
      var preview = document.getElementById('image-preview');
      var hero = document.getElementById('f-image-url').value.trim() || preview.getAttribute('data-src') ||
        (data.heroImage || '');
      var dateVal = document.getElementById('f-date').value;
      return {
        slug: document.getElementById('f-slug').value.trim(),
        headline: document.getElementById('f-headline').value.trim(),
        lede: document.getElementById('f-lede').value.trim(),
        whyItMatters: document.getElementById('f-why').value.trim(),
        realityCheck: document.getElementById('f-realitycheck').value.trim(),

        journal: document.getElementById('f-journal').value.trim(),
        journalUrl: document.getElementById('f-journal-url').value.trim(),
        trialPhase: document.getElementById('f-phase').value,

    function livePreview() {
      var s = collect();
      document.getElementById('live-preview').innerHTML =
        '<span class="cat-label">' + esc(s.category || '') + '</span>' +
        '<h3 style="font-size:19px;line-height:1.25;margin:6px 0">' + esc((s.headline || 'Headline appears here').replace(/==/g, '')) + '</h3>' +
        '<p style="font-size:14px">' + esc(s.lede || 'Lede appears here.') + '</p>' +
        (s.whyItMatters ? '<p style="font-size:13px;font-style:italic;color:var(--accent)">Why it matters: ' + esc(s.whyItMatters) + '\u2026</p>' : '') +
        '<div class="meta" style="margin-top:8px"><span>\uD83D\uDEE1\uFE0F ' + esc(s.sourceType) + '</span><span class="sep"></span><span>' + esc(s.journal || 'Journal') + '</span><span class="sep"></span><span>\u23F1 ' + s.readTime + ' min</span></div>';
      counters();
    }
    form.addEventListener('input', livePreview);
    document.getElementById('body-editor').addEventListener('input', livePreview);
    livePreview();

    /* drafts: manual + autosave every 60s */
    function saveDraft(silent) {
      var d = collect(); d._savedAt = new Date().toISOString();
      var list = drafts();
      if (currentDraftIndex == null) { list.unshift(d); currentDraftIndex = 0; }
      else list[currentDraftIndex] = d;
      set('lumen_local_drafts', list);
      document.getElementById('autosave-note').textContent = 'Saved ' + new Date().toLocaleTimeString();
      if (!silent) logActivity('saved draft \u201C' + (d.headline || 'Untitled') + '\u201D');
    }
    document.getElementById('save-draft').addEventListener('click', function () { saveDraft(false); });
    clearInterval(autosaveTimer);
    autosaveTimer = setInterval(function () {
      if (document.getElementById('f-headline') && document.getElementById('f-headline').value.trim()) saveDraft(true);
    }, 60000);

    /* AI check against the Lumen Standard */
    document.getElementById('ai-check').addEventListener('click', function () {
      var s = collect();
      var panel = document.getElementById('filter-panel');
      panel.className = 'filter-result';
      panel.innerHTML = '<h4>THE LUMEN STANDARD</h4><p style="font-size:13px">Checking with Claude\u2026</p>';
      var systemPrompt = 'You are Lumen\u2019s editorial filter. Lumen is a health and medical technology publication.\n' +
        'Your job is to check whether a story submission passes the Lumen Standard.\n' +
        'Be strict. Return ONLY a JSON object with this structure:\n' +
        '{"overall":"PASS"|"FAIL"|"NEEDS REVIEW","checks":{"source_tier":{"result":"PASS"|"FAIL"|"NEEDS REVIEW","note":"..."},"trial_phase":{"result":"...","note":"..."},"patient_numbers":{"result":"...","note":"..."},"effect_size":{"result":"...","note":"..."},"disease_burden":{"result":"...","note":"..."}},"summary":"One sentence explaining the overall result."}\n\n' +
        'The Lumen Standard criteria:\n' +
        '1. Source tier: Must be peer-reviewed in NEJM, JAMA, The Lancet, Nature Medicine, Nature, Cell, or Science. OR direct FDA/EMA/WHO source.\n' +
        '2. Trial phase: Phase 2 minimum with strong signal. Phase 3 or real-world data preferred. Phase 1 only if n>50 and effect is unambiguous.\n' +
        '3. Patient numbers: Specific n must be reported. Modelling/projections supplementary only.\n' +
        '4. Effect size: Must be clinically meaningful AND reported in absolute terms, not only relative risk reduction.\n' +
        '5. Disease burden: Must affect a meaningful global population. Rare disease acceptable if mechanism is groundbreaking.';
      var userContent = 'Story submission:\nHeadline: ' + s.headline + '\nCategory: ' + s.category +
        '\nSource type: ' + s.sourceType + '\nJournal/Institution: ' + s.journal +
        '\nTrial phase: ' + s.trialPhase + '\nPatient numbers (n): ' + s.patientN +
        '\nEffect size: ' + s.effectSize + '\nDisease burden: ' + s.diseaseBurden +
        '\nLede: ' + s.lede + '\nWhy it matters: ' + s.whyItMatters;

      fetch(AI_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system: systemPrompt, content: userContent })
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (data) {
        var text = (data.content || []).map(function (b) { return b.text || ''; }).join('\n');
        var clean = text.replace(/```json|```/g, '').trim();
        var result = JSON.parse(clean);
        lastFilter = result;
        renderFilterResult(result);
      }).catch(function (err) {
        lastFilter = null;
        panel.className = 'filter-result review';
        panel.innerHTML = '<h4>THE LUMEN STANDARD</h4>' +
          '<p style="font-size:13px"><strong>AI check unavailable, proceed manually.</strong></p>' +
          '<p style="font-size:12px;color:var(--text-muted);margin-top:8px">The /api/claude endpoint didn\u2019t respond (' + esc(err.message) + '). This works once the site is deployed to Vercel/Netlify with an ANTHROPIC_API_KEY set, see README. You can still review against the Lumen Standard yourself and publish.</p>';
      });
    });

    function renderFilterResult(r) {
      var panel = document.getElementById('filter-panel');
      var cls = r.overall === 'PASS' ? 'pass' : r.overall === 'FAIL' ? 'fail' : 'review';
      panel.className = 'filter-result ' + cls;
      var labels = { source_tier: 'Source tier', trial_phase: 'Trial phase', patient_numbers: 'Patient numbers', effect_size: 'Effect size', disease_burden: 'Disease burden' };
      var lines = Object.keys(labels).map(function (k, i) {
        var c = (r.checks || {})[k] || {};
        return '<div class="filter-line"><span class="r ' + esc(c.result) + '">' + (i + 1) + '. ' + esc(c.result || '?') + '</span><span>' + esc(labels[k]) + ', ' + esc(c.note || '') + '</span></div>';
      }).join('');
      panel.innerHTML = '<h4>THE LUMEN STANDARD, ' + esc(r.overall) + '</h4>' + lines +
        '<p style="font-size:13px;margin-top:12px">' + esc(r.summary || '') + '</p>';
    }

    /* publish */
    document.getElementById('publish').addEventListener('click', function () {
      var s = collect();
      var alertBox = document.getElementById('form-alert');
      var missing = ['headline', 'slug', 'lede', 'journal'].filter(function (k) { return !s[k]; });
      if (missing.length) {
        alertBox.innerHTML = '<div class="alert warn">Still needed before publishing: ' + missing.join(', ') + '.</div>';
        return;
      }
      if (!s.realityCheck) {
        alertBox.innerHTML = '<div class="alert warn">Reality check is empty, Lumen’s standard requires a “what this does and doesn’t mean” line.</div>';
        if (!confirm('Reality check is empty, Lumen’s standard requires a “what this does and doesn’t mean” line. Publish without it anyway?')) return;
      }
      function doPublish() {
        if (lastFilter) s._filterResult = lastFilter.overall;
        /* save locally FIRST so a failed request can never lose the editor's work */
        var list = localStories().filter(function (x) { return x.slug !== s.slug; });
        list.unshift(s);
        set('lumen_local_stories', list);

        var secret = getPublishSecret();
        if (secret == null) {
          alertBox.innerHTML = '<div class="alert warn">Publish cancelled, no publish key entered. Your work is saved locally (preview + drafts) and nothing was lost.</div>';
          return;
        }

        var merged = mergedStories();
        var corrections = ((window.LUMEN_DATA && window.LUMEN_DATA.corrections) || []).concat(get('lumen_local_corrections', []));
        var btn = document.getElementById('publish');
        var label = btn.textContent;
        btn.disabled = true; btn.textContent = 'Submitting\u2026';
        alertBox.innerHTML = '<div class="alert">Submitting to GitHub\u2026 opening a pull request for review.</div>';

        fetch('/api/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-publish-secret': secret },
          body: JSON.stringify({ slug: s.slug, stories: merged, corrections: corrections })
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
        }).then(function (res) {
          btn.disabled = false; btn.textContent = label;
          if (!res.ok) {
            if (res.status === 401) { try { sessionStorage.removeItem('lumen_publish_secret'); } catch (e) {} }
            var recover = (res.j && res.j.manualPrUrl)
              ? ' <a href="' + esc(res.j.manualPrUrl) + '" target="_blank" rel="noopener">Open the PR manually \u2192</a>'
              : '';
            alertBox.innerHTML = '<div class="alert warn">Publish failed (' + res.status + '): ' +
              esc((res.j && res.j.error) || 'Unknown error') + recover +
              '<br><span class="saved-note">Your work is saved locally, nothing was lost. You can also use \u201CDownload stories.js\u201D on the Dashboard as a fallback.</span></div>';
            return;
          }
          if (currentDraftIndex != null) {
            var d = drafts(); d.splice(currentDraftIndex, 1); set('lumen_local_drafts', d);
            currentDraftIndex = null;
          }
          logActivity('submitted \u201C' + s.headline + '\u201D to GitHub' + (lastFilter ? ' (filter: ' + lastFilter.overall + ')' : '') + (res.j.prUrl ? ', ' + res.j.prUrl : ''));
          var links = '';
          if (res.j.previewUrl) links += ' <a href="' + esc(res.j.previewUrl) + '" target="_blank" rel="noopener">Open preview \u2192</a>';
          if (res.j.prUrl) links += ' <a href="' + esc(res.j.prUrl) + '" target="_blank" rel="noopener">View pull request \u2192</a>';
          alertBox.innerHTML = '<div class="alert ok">Submitted, review the preview, then merge to go live.' + links +
            '<br><span class="saved-note">The Vercel preview is also attached to the pull request once the build finishes.</span></div>';
        }).catch(function (err) {
          btn.disabled = false; btn.textContent = label;
          alertBox.innerHTML = '<div class="alert warn">Publish failed: ' + esc(err.message) +
            '. Your work is saved locally, nothing was lost. You can use \u201CDownload stories.js\u201D on the Dashboard as a fallback.</div>';
        });
      }
      if (lastFilter && lastFilter.overall === 'FAIL') {
        var failed = Object.keys(lastFilter.checks || {}).filter(function (k) { return lastFilter.checks[k].result === 'FAIL'; }).join(', ');
        if (confirm('This story failed the Lumen Standard on: ' + failed + '. Are you sure you want to publish?')) doPublish();
      } else {
        doPublish();
      }
    });

    counters(); readTime();
  }

  /* ============================================================
     STORY MANAGEMENT (/admin/stories)
  ============================================================ */
  function renderStories() {
    var locals = localStories();
    var file = fileStories();
    var rows = locals.map(function (s) { return { s: s, local: true }; })
      .concat(file.filter(function (f) { return !locals.some(function (l) { return l.slug === f.slug; }); })
        .map(function (s) { return { s: s, local: false }; }));
    rows.sort(function (a, b) { return new Date(b.s.publishDate) - new Date(a.s.publishDate); });

    shell('#stories',
      '<h1 style="font-size:26px;margin-bottom:6px">Stories</h1>' +
      '<p style="font-size:13px;color:var(--text-muted);margin-bottom:20px"><span class="tag-local">local</span> = published from this browser, not yet in the deployed data file \u00B7 <span class="tag-file">live</span> = in data/stories.js</p>' +
      (rows.length ?
        '<div class="panel" style="padding:0;overflow-x:auto"><table class="admin-table"><thead><tr>' +
        '<th>Headline</th><th>Category</th><th>Published</th><th>Author</th><th>Filter</th><th></th><th>Actions</th></tr></thead><tbody>' +
        rows.map(function (r) {
          var s = r.s;
          return '<tr><td style="min-width:240px"><a href="story.html?slug=' + encodeURIComponent(s.slug) + '">' + esc(s.headline) + '</a></td>' +
            '<td>' + esc(s.category) + '</td>' +
            '<td>' + new Date(s.publishDate).toLocaleDateString() + '</td>' +
            '<td>' + esc(s.author || '') + '</td>' +
            '<td>' + esc(s._filterResult || ', ') + '</td>' +
            '<td>' + (r.local ? '<span class="tag-local">local</span>' : '<span class="tag-file">live</span>') + '</td>' +
            '<td class="act"><button data-edit="' + esc(s.slug) + '">Edit</button>' +
            (r.local ? '<button data-unpub="' + esc(s.slug) + '">Unpublish</button>' : '') +
            '<button data-correct="' + esc(s.slug) + '">Add correction</button></td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="panel"><p>No stories yet. <a href="#new">Write the first one \u2192</a></p></div>') +
      '<p style="font-size:12px;color:var(--text-muted);margin-top:14px">Stories marked <span class="tag-file">live</span> come from data/stories.js, to unpublish or permanently edit those, download an updated stories.js (your edits here override by slug) or edit the file directly, then redeploy.</p>');

    document.getElementById('view').addEventListener('click', function (e) {
      var t = e.target;
      if (t.hasAttribute('data-edit')) { location.hash = '#new=' + encodeURIComponent(t.getAttribute('data-edit')); }
      if (t.hasAttribute('data-unpub')) {
        var slug = t.getAttribute('data-unpub');
        if (confirm('Unpublish this story? It will be removed from your local preview.')) {
          set('lumen_local_stories', localStories().filter(function (s) { return s.slug !== slug; }));
          logActivity('unpublished \u201C' + slug + '\u201D');
          renderStories();
        }
      }
      if (t.hasAttribute('data-correct')) {
        var cslug = t.getAttribute('data-correct');
        var what = prompt('What was corrected?');
        if (!what) return;
        var why = prompt('Why? (optional)') || '';
        var corr = get('lumen_local_corrections', []);
        var story = rows.filter(function (r) { return r.s.slug === cslug; })[0];
        corr.unshift({ slug: cslug, headline: story ? story.s.headline : cslug, what: what, why: why, date: new Date().toISOString() });
        set('lumen_local_corrections', corr);
        logActivity('added correction to \u201C' + cslug + '\u201D');
        alert('Correction recorded. It appears on /corrections.html and is included in your next stories.js download.');
      }
    });
  }

  route();
})();
</script>
</body>
</html>
